<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <title>LU CONNECT Admin</title>
    <meta name="description" content="LU CONNECT Admin — manage students, content, and reports." />

    <meta name="theme-color" content="#1d9bf0" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <link rel="manifest" href="/manifest.json" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LU Admin" />
    <meta name="application-name" content="LU Admin" />
  <script>
  window.addEventListener('error', function(e) {
    document.body.innerHTML = '<pre style="color:#fff;background:#000;padding:20px;font-size:13px;white-space:pre-wrap;min-height:100vh;margin:0;">ERR:\n' +
      e.message + '\n\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n\n' + (e.error?.stack || '');
  });
  window.addEventListener('unhandledrejection', function(e) {
    document.body.innerHTML = '<pre style="color:#fff;background:#000;padding:20px;font-size:13px;white-space:pre-wrap;min-height:100vh;margin:0;">PROMISE ERR:\n' +
      (e.reason?.message || e.reason) + '\n\n' + (e.reason?.stack || '');
  });
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
